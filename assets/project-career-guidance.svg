<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="AI Career Guidance">
<defs>
<linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4F46E5"/><stop offset="50%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1E1B3A"/><stop offset="100%" stop-color="#111827"/></linearGradient>
<radialGradient id="blob" cx="0" cy="0" r="1"><stop offset="0%" stop-color="#F472B6" stop-opacity=".35"/><stop offset="100%" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect x="4" y="4" width="472" height="292" rx="18"/></clipPath>
</defs>
<style>
 .frame { fill: none; stroke: url(#grad); stroke-width: 2; stroke-dasharray: 1600; animation: draw 1.6s ease-out both, glow 3s ease-in-out 1.6s infinite; }
 .blob { animation: drift 7s ease-in-out infinite alternate; }
 .name { font: 800 25px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #FFFFFF; }
 .sub { font: 600 13px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #F472B6; letter-spacing: .3px; }
 .tl { font: 13.5px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #CBD5E1; }
 .ptt { font: 600 13px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #E5E7EB; }
 .pill { font: 700 10.5px 'Fira Code', Consolas, monospace; letter-spacing: 1.2px; text-anchor: middle; }
 .head { animation: fadeUp .6s ease-out .15s both; }
 .pt { animation: slideIn .5s ease-out both; }
 .ic { animation: pop .45s cubic-bezier(.34,1.56,.64,1) both; transform-box: fill-box; transform-origin: center; }
 .cta { font: 700 12.5px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #F472B6; text-anchor: end; animation: fadeUp .6s ease-out 1.8s both; }
 .arrow { animation: nudge 1.4s ease-in-out 2.2s infinite; }
 .emo { font-size: 24px; text-anchor: middle; }
 .ring { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
 @keyframes draw { from { stroke-dashoffset: 1600; } to { stroke-dashoffset: 0; } }
 @keyframes glow { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
 @keyframes drift { from { transform: translate(0,0); } to { transform: translate(-40px,30px); } }
 @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
 @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
 @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
 @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
 @keyframes pulse { 0%,100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.12); opacity: 1; } }
</style>
<g clip-path="url(#clip)">
 <rect x="4" y="4" width="472" height="292" fill="url(#panel)"/>
 <circle cx="440" cy="30" r="190" fill="url(#blob)" class="blob"/>
</g>
<rect x="4" y="4" width="472" height="292" rx="18" class="frame"/>
<g class="head">
 <circle cx="50" cy="52" r="24" fill="#F472B6" fill-opacity=".14"/>
 <circle cx="50" cy="52" r="24" fill="none" stroke="#F472B6" stroke-width="1.5" class="ring"/>
 <text x="50" y="61" class="emo">🎯</text>
 <text x="88" y="52" class="name">AI Career Guidance</text>
 <text x="88" y="73" class="sub">Career intelligence platform</text>
 <rect x="309" y="18" width="52" height="20" rx="10" fill="#F472B6" fill-opacity=".15" stroke="#F472B6" stroke-opacity=".6"/>
 <text x="335" y="32" class="pill" fill="#F472B6">TEAM</text>
 <rect x="369" y="18" width="87" height="20" rx="10" fill="#7C3AED" fill-opacity=".15" stroke="#A78BFA" stroke-opacity=".6"/>
 <text x="413" y="32" class="pill" fill="#C4B5FD">HACKATHON</text>
 <text x="28" y="122" class="tl">Connects people's skills, interests and education with</text><text x="28" y="141" class="tl">suitable career paths.</text>
</g>
<g class="pt" style="animation-delay:0.70s"><circle cx="34" cy="174" r="7" fill="#F472B6" fill-opacity=".18"/><path d="M30.5 174 l2.5 2.5 l4.5 -5" stroke="#F472B6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="178" class="ptt">Personalised career recommendations</text></g><g class="pt" style="animation-delay:0.88s"><circle cx="34" cy="198" r="7" fill="#F472B6" fill-opacity=".18"/><path d="M30.5 198 l2.5 2.5 l4.5 -5" stroke="#F472B6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="202" class="ptt">Resume analysis and skill-gap detection</text></g><g class="pt" style="animation-delay:1.06s"><circle cx="34" cy="222" r="7" fill="#F472B6" fill-opacity=".18"/><path d="M30.5 222 l2.5 2.5 l4.5 -5" stroke="#F472B6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="226" class="ptt">AI mock interviews and downloadable reports</text></g>
<line x1="28" y1="238" x2="452" y2="238" stroke="#30363D"/>
