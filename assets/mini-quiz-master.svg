<g class="arr"><circle cx="434" cy="145" r="13" fill="#C084FC" fill-opacity=".15"/><path d="M428 145 h11 m-4 -4 l4 4 l-4 4" stroke="#C084FC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>