<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 176" width="470" height="176" role="img" aria-label="Quiz Master">
<defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4F46E5"/><stop offset="50%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1E1B3A"/><stop offset="100%" stop-color="#111827"/></linearGradient>
<radialGradient id="blob" cx="0" cy="0" r="1"><stop offset="0%" stop-color="#C084FC" stop-opacity=".28"/><stop offset="100%" stop-color="#C084FC" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect x="3" y="3" width="464" height="170" rx="16"/></clipPath></defs>
<style>
 .frame { fill: none; stroke: url(#grad); stroke-width: 1.6; stroke-dasharray: 3000; animation: draw 2s ease-out both; }
 .bar { animation: glow 2.6s ease-in-out infinite; }
 .n { font: 800 19px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #FFFFFF; }
 .t { font: 700 9.5px 'Fira Code', Consolas, monospace; letter-spacing: 1.2px; text-anchor: middle; }
 .d { font: 12.5px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #CBD5E1; }
 .m { font: 700 11.5px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
 .c { font: 600 10.5px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #CBD5E1; text-anchor: middle; }
 .emo { font-size: 19px; text-anchor: middle; }
 .head { animation: slideIn .55s ease-out .1s both; }
 .body { animation: fadeUp .6s ease-out .45s both; }
 .ic { animation: pop .45s cubic-bezier(.34,1.56,.64,1) both; transform-box: fill-box; transform-origin: center; }
 .dot { animation: glow 1.4s ease-in-out infinite; }
 .arr { animation: nudge 1.4s ease-in-out 1.6s infinite; }
 @keyframes draw { from { stroke-dashoffset: 3000; } to { stroke-dashoffset: 0; } }
 @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
 @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
 @keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
 @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
 @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
</style>
<g clip-path="url(#clip)"><rect x="3" y="3" width="464" height="170" fill="url(#panel)"/><circle cx="440" cy="10" r="170" fill="url(#blob)"/>
<rect x="3" y="3" width="5" height="170" fill="#C084FC" class="bar"/></g>
<rect x="3" y="3" width="464" height="170" rx="16" class="frame"/>
<g class="head">
 <circle cx="42" cy="40" r="19" fill="#C084FC" fill-opacity=".15" stroke="#C084FC" stroke-opacity=".6"/>
 <text x="42" y="47" class="emo">🧠</text>
 <text x="72" y="47" class="n">Quiz Master</text>
 <rect x="382" y="16" width="66" height="20" rx="10" fill="#C084FC" fill-opacity=".12" stroke="#C084FC" stroke-opacity=".6"/>
 <text x="415" y="29.5" class="t" fill="#C084FC">ANDROID</text>
</g>
<g class="body"><text x="24" y="84" class="d">Timed quizzes with achievements, leaderboards and multiplayer-</text><text x="24" y="102" class="d">oriented features.</text></g>
<g class="ic" style="animation-delay:.9s"><rect x="24" y="132" width="116" height="26" rx="13" fill="#C084FC" fill-opacity=".16" stroke="#C084FC" stroke-opacity=".7"/><circle cx="37" cy="145" r="3.5" fill="#C084FC" class="dot"/><text x="46" y="149.5" class="m" fill="#C084FC">Leaderboards</text></g><g class="ic" style="animation-delay:1.00s"><rect x="150.4" y="132" width="26" height="26" rx="7" fill="#0D1117" stroke="#30363D"/><g transform="translate(156.4,138) scale(0.583)"><path d="M24 24H0V0h24L12 12Z" fill="#7F52FF"/></g></g><g class="ic" style="animation-delay:1.07s"><rect x="181.4" y="132" width="26" height="26" rx="7" fill="#0D1117" stroke="#30363D"/><g transform="translate(187.4,138) scale(0.583)"><path d="M12.135.003a2.577 2.577 0 0 0-1.42.344L2.55 5.06a2.577 2.577 0 0 0-.953.967l3.957 2.17a1.765 1.765 0 0 1 .603-.588l4.951-2.86a1.761 1.761 0 0 1 1.76 0l4.951 2.86a1.753 1.753 0 0 1 .526.46l3.921-2.265a2.577 2.577 0 0 0-.816-.744L13.291.347a2.577 2.577 0 0 0-1.152-.34Zm-.145 4.912a1.36 1.36 0 0 0-.68.182L6.36 7.953a1.345 1.345 0 0 0-.454.435l1.92 1.055a1.05 1.05 0 0 1 .31-.275l3.34-1.928a1.054 1.054 0 0 1 1.051 0l3.336 1.928a1.066 1.066 0 0 1 .238.199l.018-.01-.002-.002 1.877-1.08a1.353 1.353 0 0 0-.373-.322l-4.95-2.86a1.357 1.357 0 0 0-.68-.178Zm10.432 1.149-3.92 2.26a1.757 1.757 0 0 1 .2.812v5.715c0 .627-.332 1.21-.88 1.528l-4.95 2.86a1.761 1.761 0 0 1-.64.214v4.524a2.577 2.577 0 0 0 1.059-.313l8.162-4.713a2.577 2.577 0 0 0 1.289-2.23V7.297a2.577 2.577 0 0 0-.318-1.228Zm-20.937.238a2.577 2.577 0 0 0-.227.99v9.43c0 .918.491 1.767 1.293 2.229l8.162 4.713a2.57 2.57 0 0 0 1.225.336v-4.531a1.761 1.761 0 0 1-.833-.235L6.156 16.38a1.765 1.765 0 0 1-.877-1.528V9.136a1.776 1.776 0 0 1 .131-.676Zm16.67 2.223-1.89 1.092a1.058 1.058 0 0 1 .124.46v3.856c0 .378-.2.72-.526.907l-3.336 1.93a1.04 1.04 0 0 1-.295.107v2.17c.152-.027.304-.078.44-.157l4.949-2.859a1.36 1.36 0 0 0 .68-1.18V9.136a1.36 1.36 0 0 0-.147-.607Zm-12.387.13a1.36 1.36 0 0 0-.088.481v5.715a1.36 1.36 0 0 0 .