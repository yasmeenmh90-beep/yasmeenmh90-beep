<g class="n"><path d="M172 24 h9 m-3.5 -3.5 l3.5 3.5 l-3.5 3.5" stroke="#D6B66F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>