<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" role="img" aria-label="Live demo">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#342C20"/><stop offset="50%" stop-color="#342C20"/><stop offset="100%" stop-color="#B28B49"/></linearGradient>
<linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#101010"/><stop offset="100%" stop-color="#101010"/></linearGradient></defs>
<style>
 .t { font: 700 15px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #F5F1E8; }
 .a { font: 700 15px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
 .pulse {  transform-box: fill-box; transform-origin: center; }
 .n {  }
 @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.9); opacity: 0; } }
 @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
</style>
<rect x="2" y="2" width="196" height="44" rx="22" fill="url(#p)" stroke="url(#g)" stroke-width="2"/>
<circle cx="32" cy="24" r="6" fill="#D6B66F" class="pulse"/><circle cx="32" cy="24" r="5" fill="#D6B66F"/>
