<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Hackathon track record">
<defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4F46E5"/><stop offset="50%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1E1B3A"/><stop offset="100%" stop-color="#111827"/></linearGradient>
<radialGradient id="blob" cx="0" cy="0" r="1"><stop offset="0%" stop-color="#EC4899" stop-opacity=".3"/><stop offset="100%" stop-color="#EC4899" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect x="4" y="4" width="472" height="292" rx="18"/></clipPath></defs>
<style>
 .frame { fill:none; stroke:url(#grad); stroke-width:2; stroke-dasharray:1600; animation: draw 1.6s ease-out both, glow 3s ease-in-out 1.6s infinite; }
 .k { font: 700 11px 'Fira Code', Consolas, monospace; fill:#C4B5FD; letter-spacing:2.4px; }
 .h { font: 800 24px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill:#FFFFFF; }
 .v { font: 800 24px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
 .l { font: 600 12px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill:#CBD5E1; }
 .dm { font: 600 11px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill:#DDD6FE; text-anchor:middle; }
 .gl { animation: glow 2.4s ease-in-out infinite; }
 .fu { animation: fadeUp .6s ease-out .1s both; }
 .pop { animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; transform-box: fill-box; transform-origin: center; }
 .blob { animation: drift 7s ease-in-out infinite alternate; }
 @keyframes draw { from { stroke-dashoffset:1600; } to { stroke-dashoffset:0; } }
 @keyframes glow { 0%,100% { opacity:.55; } 50% { opacity:1; } }
 @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
 @keyframes pop { from { opacity:0; transform:scale(.5); } to { opacity:1; transform:scale(1); } }
 @keyframes drift { from { transform:translate(0,0); } to { transform:translate(-40px,30px); } }
</style>
<g clip-path="url(#clip)"><rect x="4" y="4" width="472" height="292" fill="url(#panel)"/><circle cx="440" cy="30" r="190" fill="url(#blob)" class="blob"/></g>
<rect x="4" y="4" width="472" height="292" rx="18" class="frame"/>
<g class="fu"><text x="28" y="42" class="k">🏆 TRACK RECORD</text><text x="28" y="72" class="h">Hackathon Summary</text></g>
<g class="pop" style="animation-delay:0.40s"><rect x="28" y="88" width="206" height="70" rx="12" fill="#0D1117" stroke="#22D3EE" stroke-opacity=".45"/><rect x="28" y="106" width="3" height="34" rx="1.5" fill="#22D3EE" class="gl"/><text x="48" y="126" class="v" fill="#22D3EE">5</text><text x="48" y="146" class="l">Projects shipped</text></g><g class="pop" style="animation-delay:0.55s"><rect x="246" y="88" width="206" height="70" rx="12" fill="#0D1117" stroke="#A78BFA" stroke-opacity=".45"/><rect x="246" y="106" width="3" height="34" rx="1.5" fill="#A78BFA" class="gl"/><text x="266" y="126" class="v" fill="#A78BFA">1 / 4</text><text x="266" y="146" class="l">Solo / Team</text></g><g class="pop" style="animation-delay:0.70s"><rect x="28" y="166" width="206" height="70" rx="12" fill="#0D1117" stroke="#34D399" stroke-opacity=".45"/><rect x="28" y="184" width="3" height="34" rx="1.5" fill="#34D399" class="gl"/><text x="48" y="204" class="v" fill="#34D399">5 / 5</text><text x="48" y="224" class="l">Live demos</text></g><g class="pop" style="animation-delay:0.85s"><rect x="246" y="166" width="206" height="70" rx="12" fill="#0D1117" stroke="#F472B6" stroke-opacity=".45"/><rect x="246" y="184" width="3" height="34" rx="1.5" fill="#F472B6" class="gl"/><text x="266" y="204" class="v" fill="#F472B6">5 / 5</text><text x="266" y="224" class="l">Video demos</text></g>
<text x="28" y="252" class="k" style="font-size:10px">DOMAINS</text>
<g class="pop" style="animation-delay:1.10s"><rect x="28" y="262" width="90" height="22" rx="11" fill="#7C3AED" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".5"/><text x="73.0" y="277" class="dm">Agentic AI</text></g><g class="pop" style="animation-delay:1.20s"><rect x="125" y="262" width="41" height="22" rx="11" fill="#7C3AED" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".5"/><text x="145.5" y="277" class="dm">RAG</text></g><g class="pop" style="animation-delay:1.30s"><rect x="173" y="262" width="69" height="22" rx="11" fill="#7C3AED" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".5"/><text x="207.5" y="277" class="dm">FinTech</text></g><g class="pop" style="animation-delay:1.40s"><rect x="249" y="262" width="90" height="22" rx="11" fill="#7C3AED" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".5"/><text x="294.0" y="277" class="dm">Civic tech</text></g><g class="pop" style="animation-delay:1.50s"><rect x="346" y="262" width="83" height="22" rx="11" fill="#7C3AED" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".5"/><text x="387.5" y="277" class="dm">Career AI</text></g>
</svg>