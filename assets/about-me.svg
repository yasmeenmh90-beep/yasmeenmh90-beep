<text x="44" y="56" class="tag">WHO I AM</text>
<text x="44" y="92" class="txt" style="animation-delay:0.25s"><tspan class="n">I'm an </tspan><tspan class="b">AI/ML Engineer and Applied AI</tspan></text>
<text x="44" y="118" class="txt" style="animation-delay:0.34s"><tspan class="b">Developer</tspan><tspan class="n"> with an MSc in Artificial Intelligence,</tspan></text>
<text x="44" y="144" class="txt" style="animation-delay:0.43s"><tspan class="n">graduating with </tspan><tspan class="b">First Class Distinction</tspan><tspan class="n"> and</tspan></text>
<text x="44" y="170" class="txt" style="animation-delay:0.52s"><tspan class="n">ranking </tspan><tspan class="b">#1 in my cohort</tspan><tspan class="n">.</tspan></text>
<text x="44" y="210" class="txt" style="animation-delay:0.70s"><tspan class="n">I build AI systems that move beyond model</tspan></text>
<text x="44" y="236" class="txt" style="animation-delay:0.79s"><tspan class="n">prototypes into </tspan><tspan class="b">complete applications</tspan><tspan class="n">: multi-</tspan></text>
<text x="44" y="262" class="txt" style="animation-delay:0.88s"><tspan class="n">agent architectures, RAG, human-in-the-loop</tspan></text>
<text x="44" y="288" class="txt" style="animation-delay:0.97s"><tspan class="n">workflows, LLM security, real-time ML pipelines,</tspan></text>
<text x="44" y="314" class="txt" style="animation-delay:1.06s"><tspan class="n">APIs, dashboards and cloud deployments.</tspan></text>
