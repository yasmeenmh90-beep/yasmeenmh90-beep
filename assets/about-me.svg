<style>
 .txt { font: 16px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; animation: fadeUp .6s ease-out both; }
 .n { fill: #CBD5E1; } .b { fill: #FFFFFF; font-weight: 700; }
 .chip { animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; transform-box: fill-box; transform-origin: center; }
 .chipt { font: 600 13px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; text-anchor: middle; }
 .code { font: 13.5px 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
 .frame { fill: none; stroke: url(#grad); stroke-width: 2; stroke-dasharray: 1600; animation: draw 1.8s ease-out both, glow 3s ease-in-out 1.8s infinite; }
 .win { animation: fadeUp .7s ease-out .2s both; }
 .tag { font: 700 13px 'Fira Code', Consolas, monospace; fill: #A78BFA; letter-spacing: 3px; animation: fadeUp .6s ease-out both; }
 .cursor { animation: blink 1s step-end infinite; }
 @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
 @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
 @keyframes draw { from { stroke-dashoffset: 1600; } to { stroke-dashoffset: 0; } }
 @keyframes glow { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
 @keyframes blink { 50% { opacity: 0; } }
</style>
