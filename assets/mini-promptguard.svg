<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 176" width="470" height="176" role="img" aria-label="PromptGuard">
<defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4F46E5"/><stop offset="50%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1E1B3A"/><stop offset="100%" stop-color="#111827"/></linearGradient>
<radialGradient id="blob" cx="0" cy="0" r="1"><stop offset="0%" stop-color="#F87171" stop-opacity=".28"/><stop offset="100%" stop-color="#F87171" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect x="3" y="3" width="464" height="170" rx="16"/></clipPath></defs>
<style>
 .frame { fill: none; stroke: url(#grad); stroke-width: 1.6; stroke-dasharray: 3000; animation: draw 2s ease-out both; }
 .bar { animation: glow 2.6s ease-in-out infinite; }
 .n { font: 800 19px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #FFFFFF; }
 .t { font: 700 9.5px 'Fira Code', Consolas, monospace; letter-spacing: 1.2px; text-anchor: middle; }
 .d { font: 12.5px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #CBD5E1; }
 .m { font: 700 11.5px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
 .c { font: 600 10.5px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #CBD5E1; text-anchor: middle; }
 .emo { font-size: 19px; text-anchor: middle; }
 .head { animation: slideIn .55s ease-out .1s both; }
 .body { animation: fadeUp .6s ease-out .45s both; }
 .ic { animation: pop .45s cubic-bezier(.34,1.56,.64,1) both; transform-box: fill-box; transform-origin: center; }
 .dot { animation: glow 1.4s ease-in-out infinite; }
 .arr { animation: nudge 1.4s ease-in-out 1.6s infinite; }
 @keyframes draw { from { stroke-dashoffset: 3000; } to { stroke-dashoffset: 0; } }
 @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
 @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
 @keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
 @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
 @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
</style>
<g clip-path="url(#clip)"><rect x="3" y="3" width="464" height="170" fill="url(#panel)"/><circle cx="440" cy="10" r="170" fill="url(#blob)"/>
<rect x="3" y="3" width="5" height="170" fill="#F87171" class="bar"/></g>
<rect x="3" y="3" width="464" height="170" rx="16" class="frame"/>
<g class="head">
 <circle cx="42" cy="40" r="19" fill="#F87171" fill-opacity=".15" stroke="#F87171" stroke-opacity=".6"/>
 <text x="42" y="47" class="emo">🛡️</text>
 <text x="72" y="47" class="n">PromptGuard</text>
 <rect x="347" y="16" width="101" height="20" rx="10" fill="#F87171" fill-opacity=".12" stroke="#F87171" stroke-opacity=".6"/>
 <text x="398" y="29.5" class="t" fill="#F87171">LLM SECURITY</text>
</g>
<g class="body"><text x="24" y="84" class="d">Automated security testing that evaluates LLM apps against</text><text x="24" y="102" class="d">prompt-injection and adversarial inputs.</text></g>
