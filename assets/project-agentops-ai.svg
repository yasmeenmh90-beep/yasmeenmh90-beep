<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="AgentOps AI">
<defs>
<linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4F46E5"/><stop offset="50%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1E1B3A"/><stop offset="100%" stop-color="#111827"/></linearGradient>
<radialGradient id="blob" cx="0" cy="0" r="1"><stop offset="0%" stop-color="#76B900" stop-opacity=".35"/><stop offset="100%" stop-color="#76B900" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><path d="M4 300V22Q4 4 22 4H458Q476 4 476 22V300Z"/></clipPath>
</defs>
<style>
 .frame { fill: none; stroke: url(#grad); stroke-width: 2; stroke-dasharray: 1600; animation: draw 1.6s ease-out both, glow 3s ease-in-out 1.6s infinite; }
 .blob { animation: drift 7s ease-in-out infinite alternate; }
 .name { font: 800 25px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #FFFFFF; }
 .sub { font: 600 13px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #76B900; letter-spacing: .3px; }
 .tl { font: 13.5px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #CBD5E1; }
 .ptt { font: 600 13px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #E5E7EB; }
 .pill { font: 700 10.5px 'Fira Code', Consolas, monospace; letter-spacing: 1.2px; text-anchor: middle; }
 .head { animation: fadeUp .6s ease-out .15s both; }
 .pt { animation: slideIn .5s ease-out both; }
 .ic { animation: pop .45s cubic-bezier(.34,1.56,.64,1) both; transform-box: fill-box; transform-origin: center; }
 .cta { font: 700 12.5px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #76B900; text-anchor: end; animation: fadeUp .6s ease-out 1.8s both; }
 .arrow { animation: nudge 1.4s ease-in-out 2.2s infinite; }
 .emo { font-size: 24px; text-anchor: middle; }
 .ring { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
 @keyframes draw { from { stroke-dashoffset: 1600; } to { stroke-dashoffset: 0; } }
 @keyframes glow { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
 @keyframes drift { from { transform: translate(0,0); } to { transform: translate(-40px,30px); } }
 @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
 @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
 @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
 @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
 @keyframes pulse { 0%,100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.12); opacity: 1; } }
</style>
<g clip-path="url(#clip)">
 <rect x="4" y="4" width="472" height="296" fill="url(#panel)"/>
 <circle cx="440" cy="30" r="190" fill="url(#blob)" class="blob"/>
</g>
<path d="M4 300V22Q4 4 22 4H458Q476 4 476 22V300" class="frame"/>
<g class="head">
 <circle cx="50" cy="52" r="24" fill="#76B900" fill-opacity=".14"/>
 <circle cx="50" cy="52" r="24" fill="none" stroke="#76B900" stroke-width="1.5" class="ring"/>
 <text x="50" y="61" class="emo">🛠️</text>
 <text x="88" y="52" class="name">AgentOps AI</text>
 <text x="88" y="73" class="sub">AI incident engineering workspace</text>
 <rect x="309" y="18" width="52" height="20" rx="10" fill="#76B900" fill-opacity=".15" stroke="#76B900" stroke-opacity=".6"/>
 <text x="335" y="32" class="pill" fill="#76B900">TEAM</text>
 <rect x="369" y="18" width="87" height="20" rx="10" fill="#7C3AED" fill-opacity=".15" stroke="#A78BFA" stroke-opacity=".6"/>
 <text x="413" y="32" class="pill" fill="#C4B5FD">HACKATHON</text>
 <text x="28" y="122" class="tl">Nebius × NVIDIA Global AI Hackathon 2026</text><text x="28" y="141" class="tl">Python errors → verified fixes → human-approved PRs.</text>
</g>
<g class="pt" style="animation-delay:0.70s"><circle cx="34" cy="174" r="7" fill="#76B900" fill-opacity=".18"/><path d="M30.5 174 l2.5 2.5 l4.5 -5" stroke="#76B900" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="178" class="ptt">Detect, investigate, fix and verify with agents</text></g><g class="pt" style="animation-delay:0.88s"><circle cx="34" cy="198" r="7" fill="#76B900" fill-opacity=".18"/><path d="M30.5 198 l2.5 2.5 l4.5 -5" stroke="#76B900" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="202" class="ptt">NVIDIA Nemotron via Nebius Token Factory</text></g><g class="pt" style="animation-delay:1.06s"><circle cx="34" cy="222" r="7" fill="#76B900" fill-opacity=".18"/><path d="M30.5 222 l2.5 2.5 l4.5 -5" stroke="#76B900" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="226" class="ptt">Regression tests, Docker sandbox and GitHub PRs</text></g>
<line x1="28" y1="238" x2="452" y2="238" stroke="#30363D"/>
<g class="ic" style="animation-delay:1.3s" transform="translate(28,252)"><title>FastAPI</title><rect width="28" height="28" rx="7" fill="#0D1117" stroke="#30363D"/><circle cx="14" cy="14" r="10" fill="#009688"/><path d="M15 6L8 15h5l-1 7 8-11h-5z" fill="white"/></g>
<g class="ic" style="animation-delay:1.3800000000000001s" transform="translate(62,252)"><title>React</title><rect width="28" height="28" rx="7" fill="#0D1117" stroke="#30363D"/><g transform="translate(14 14)" fill="none" stroke="#61DAFB" stroke-width="1"><ellipse rx="11" ry="4"/><ellipse rx="11" ry="4" transform="rotate(60)"/><ellipse rx="11" ry="4" transform="rotate(120)"/><circle r="2" fill="#61DAFB" stroke="none"/></g></g>
<g class="ic" style="animation-delay:1.46s" transform="translate(96,252)"><title>TypeScript</title><rect width="28" height="28" rx="7" fill="#0D1117" stroke="#30363D"/><rect x="4" y="4" width="20" height="20" rx="2" fill="#3178C6"/><text x="14" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">TS</text></g>
<g class="ic" style="animation-delay:1.54s" transform="translate(130,252)"><title>pytest</title><rect width="28" height="28" rx="7" fill="#0D1117" stroke="#30363D"/><path d="M6 7h16M6 11h16" stroke="#009FE3" stroke-width="2"/><path d="M8 4v3m6-3v3m6-3v3" stroke="#009FE3" stroke-width="2"/><path d="M8 14v9" stroke="#F4D03F" stroke-width="3"/><path d="M14 14v7" stroke="#E74C3C" stroke-width="3"/><path d="M20 14v9" stroke="#2ECC71" stroke-width="3"/></g>
<text x="436" y="271" class="cta">View code</text>
<path d="M442 266.5 h10 m-4 -4 l4 4 l-4 4" stroke="#76B900" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>