<rect x="3" y="3" width="464" height="170" rx="16" class="frame"/>
<g class="head">
 <circle cx="42" cy="40" r="19" fill="#F59E0B" fill-opacity=".15" stroke="#F59E0B" stroke-opacity=".6"/>
