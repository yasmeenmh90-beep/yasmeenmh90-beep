<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Face Recognition — Syntecxhub Week 3 project 1">
<defs><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4F46E5"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1E1B3A"/><stop offset="1" stop-color="#111827"/></linearGradient><radialGradient id="glow"><stop stop-color="#38BDF8" stop-opacity=".22"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient><clipPath id="cut"><rect x="4" y="4" width="472" height="292" rx="18"/></clipPath></defs>
<style>.name{font:800 24px 'Segoe UI',Arial,sans-serif;fill:#fff}.sub{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#38BDF8}.desc{font:13.5px 'Segoe UI',Arial,sans-serif;fill:#CBD5E1}.item{font:600 12.5px 'Segoe UI',Arial,sans-serif;fill:#E5E7EB}.tag{font:700 10px Consolas,monospace;letter-spacing:.6px;text-anchor:middle}.cta{font:700 12.5px 'Segoe UI',Arial,sans-serif;fill:#38BDF8}.edge{stroke-dasharray:1600;animation:draw 1.7s ease-out both}.fade{animation:fade .65s ease-out both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes draw{from{stroke-dashoffset:1600}to{stroke-dashoffset:0}}</style>
<g clip-path="url(#cut)"><rect x="4" y="4" width="472" height="292" fill="url(#bg)"/><circle cx="420" cy="28" r="170" fill="url(#glow)"/></g><rect x="4" y="4" width="472" height="292" rx="18" stroke="url(#border)" stroke-width="2" fill="none" class="edge"/>
<g class="fade"><circle cx="51" cy="52" r="24" fill="#38BDF8" fill-opacity=".14" stroke="#38BDF8" stroke-opacity=".65"/><text x="51" y="60" font-size="24" text-anchor="middle">👁️</text><text x="88" y="52" class="name">Face Recognition</text><text x="88" y="73" class="sub">Real-time computer vision · OpenCV</text>
<rect x="370" y="17" width="86" height="22" rx="11" fill="#7C3AED" fill-opacity=".2" stroke="#A78BFA" stroke-opacity=".55"/><text x="413" y="32" class="tag" fill="#C4B5FD">PROJECT 1</text>
<text x="28" y="121" class="desc">Recognises registered faces in webcam video,</text><text x="28" y="141" class="desc">images and files; unknown faces stay labelled.</text></g>
<g style="animation:fade .5s ease-out 0.55s both"><circle cx="36" cy="174" r="7" fill="#38BDF8" fill-opacity=".17"/><path d="M32.5 174 l2.5 2.5 l4.5 -5" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/><text x="51" y="178" class="item">YuNet DNN + Haar cascade face detection</text></g>
<g style="animation:fade .5s ease-out 0.73s both"><circle cx="36" cy="198" r="7" fill="#38BDF8" fill-opacity=".17"/><path d="M32.5 198 l2.5 2.5 l4.5 -5" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/><text x="51" y="202" class="item">SFace 128-d embeddings and cosine matching</text></g>
<g style="animation:fade .5s ease-out 0.91s both"><circle cx="36" cy="222" r="7" fill="#38BDF8" fill-opacity=".17"/><path d="M32.5 222 l2.5 2.5 l4.5 -5" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/><text x="51" y="226" class="item">Multi-face labels, registration and management</text></g>
<line x1="28" y1="240" x2="452" y2="240" stroke="#30363D"/><rect x="28" y="252" width="28" height="28" rx="7" fill="#0D1117" stroke="#30363D"/><text x="42" y="271" font-size="17" text-anchor="middle">🐍</text><text x="367" y="271" class="cta">View code</text><path d="M430 267 h20 m-6 -5 l6 5 l-6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>