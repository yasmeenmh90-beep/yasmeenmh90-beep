<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Syntecxhub internship, Week 1: RescueBot A* maze solver and PhishGuard rule-based expert system">
<defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4F46E5"/><stop offset="50%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1E1B3A"/><stop offset="100%" stop-color="#111827"/></linearGradient>
<linearGradient id="gline" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="930" y2="0"><stop offset="0%" stop-color="#7C3AED" stop-opacity=".8"/><stop offset="100%" stop-color="#EC4899" stop-opacity="0"/></linearGradient>
<radialGradient id="blob" cx="0" cy="0" r="1"><stop offset="0%" stop-color="#7C3AED" stop-opacity=".3"/><stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect x="4" y="4" width="952" height="422" rx="20"/></clipPath></defs>
<style>
 .frame { fill: none; stroke: url(#grad); stroke-width: 2; stroke-dasharray: 3000; animation: draw 2.2s ease-out both; }
 .pill { font: 700 10.5px 'Fira Code', Consolas, monospace; letter-spacing: 1.2px; text-anchor: middle; }
 .title { font: 800 40px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #FFFFFF; }
 .sub { font: 600 15px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #A78BFA; }
 .name { font: 800 22px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #FFFFFF; }
 .psub { font: 600 12.5px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
 .d { font: 13.5px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #CBD5E1; }
 .f { font: 600 13px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #E5E7EB; }
 .cap { font: 11.5px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #8B949E; }
 .cta { font: 700 12.5px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; text-anchor: end; }
 .emo { font-size: 22px; text-anchor: middle; }
 .rule { stroke: url(#gline); stroke-width: 1.5; }
 .fu { animation: fadeUp .6s ease-out both; }
 .si { animation: slideIn .5s ease-out both; }
 .ring { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
 .arrow { animation: nudge 1.4s ease-in-out 2.4s infinite; }
 .blob { animation: drift 8s ease-in-out infinite alternate; }
 @keyframes drift { from { transform: translate(0,0); } to { transform: translate(60px,40px); } }
 @keyframes draw { from { stroke-dashoffset: 3000; } to { stroke-dashoffset: 0; } }
 @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
 @keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
 @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
 @keyframes pulse { 0%,100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.12); opacity: 1; } }
</style>
<g clip-path="url(#clip)"><rect x="4" y="4" width="952" height="422" fill="url(#panel)"/><circle cx="120" cy="60" r="300" fill="url(#blob)" class="blob"/></g>
<rect x="4" y="4" width="952" height="422" rx="20" class="frame"/>
<g class="fu" style="animation-delay:.1s">
 <rect x="28" y="28" width="112" height="22" rx="11" fill="#7C3AED" fill-opacity=".18" stroke="#A78BFA" stroke-opacity=".7"/>
 <text x="84" y="43.5" class="pill" fill="#C4B5FD">SYNTECXHUB</text>
 <rect x="148" y="28" width="124" height="22" rx="11" fill="#EC4899" fill-opacity=".14" stroke="#F472B6" stroke-opacity=".7"/>
 <text x="210" y="43.5" class="pill" fill="#F9A8D4">AI INTERNSHIP</text>
</g>
<g class="fu" style="animation-delay:.25s">
 <text x="28" y="100" class="title">Week 1</text>
 <text x="186" y="99" class="sub">Artificial Intelligence track · 2 projects completed</text>
 <line x1="28" y1="122" x2="932" y2="122" class="rule"/>
</g>
<g class="fu" style="animation-delay:0.45s">
 <rect x="28" y="150" width="438" height="246" rx="16" fill="#0D1117" fill-opacity=".55" stroke="#34D399" stroke-opacity=".45" stroke-width="1.5"/>
 <circle cx="68" cy="190" r="22" fill="#34D399" fill-opacity=".14"/><circle cx="68" cy="190" r="22" fill="none" stroke="#34D399" stroke-width="1.5" class="ring"/>
 <text x="68" y="198" class="emo">🤖</text>
 <text x="102" y="188" class="name">RescueBot</text>
 <text x="102" y="208" class="psub" fill="#34D399">A* maze solver</text>
 <rect x="370" y="166" width="80" height="20" rx="10" fill="#34D399" fill-opacity=".15" stroke="#34D399" stroke-opacity=".6"/>
 <text x="410" y="180" class="pill" fill="#34D399">PROJECT 1</text>
 <text x="48" y="242" class="d">Finds the shortest escape route through a maze</text><text x="48" y="260" class="d">and replays the search as an animated SVG.</text>
</g><g class="si" style="animation-delay:0.70s"><circle cx="56" cy="290" r="7" fill="#34D399" fill-opacity=".18"/><path d="M52.5 290 l2.5 2.5 l4.5 -5" stroke="#34D399" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="294" class="f">A* plus 4 other search algorithms, one API</text></g><g class="si" style="animation-delay:0.85s"><circle cx="56" cy="314" r="7" fill="#34D399" fill-opacity=".18"/><path d="M52.5 314 l2.5 2.5 l4.5 -5" stroke="#34D399" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="318" class="f">5 heuristics, 4- or 8-way movement</text></g><g class="si" style="animation-delay:1.00s"><circle cx="56" cy="338" r="7" fill="#34D399" fill-opacity=".18"/><path d="M52.5 338 l2.5 2.5 l4.5 -5" stroke="#34D399" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="342" class="f">31 unit tests, all passing</text></g><line x1="48" y1="360" x2="446" y2="360" stroke="#30363D"/>
<text x="48" y="382" class="cap">Python · standard library only</text>
<g class="fu" style="animation-delay:1.35s"><text x="428" y="382" class="cta" fill="#34D399">View code</text>
<g class="arrow"><path d="M434 377.5 h10 m-4 -4 l4 4 l-4 4" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g class="fu" style="animation-delay:0.65s">
 <rect x="494" y="150" width="438" height="246" rx="16" fill="#0D1117" fill-opacity=".55" stroke="#FBBF24" stroke-opacity=".45" stroke-width="1.5"/>
 <circle cx="534" cy="190" r="22" fill="#FBBF24" fill-opacity=".14"/><circle cx="534" cy="190" r="22" fill="none" stroke="#FBBF24" stroke-width="1.5" class="ring"/>
 <text x="534" y="198" class="emo">🛡️</text>
 <text x="568" y="188" class="name">PhishGuard</text>
 <text x="568" y="208" class="psub" fill="#FBBF24">Rule-based expert system</text>
 <rect x="836" y="166" width="80" height="20" rx="10" fill="#FBBF24" fill-opacity=".15" stroke="#FBBF24" stroke-opacity=".6"/>
 <text x="876" y="180" class="pill" fill="#FBBF24">PROJECT 2</text>
 <text x="514" y="242" class="d">Reads a suspicious message and explains exactly</text><text x="514" y="260" class="d">why it looks like a scam, step by step.</text>
</g><g class="si" style="animation-delay:0.90s"><circle cx="522" cy="290" r="7" fill="#FBBF24" fill-opacity=".18"/><path d="M518.5 290 l2.5 2.5 l4.5 -5" stroke="#FBBF24" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="538" y="294" class="f">48 if-then rules with forward chaining</text></g><g class="si" style="animation-delay:1.05s"><circle cx="522" cy="314" r="7" fill="#FBBF24" fill-opacity=".18"/><path d="M518.5 314 l2.5 2.5 l4.5 -5" stroke="#FBBF24" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="538" y="318" class="f">Certainty factors, chains up to 5 rules deep</text></g><g class="si" style="animation-delay:1.20s"><circle cx="522" cy="338" r="7" fill="#FBBF24" fill-opacity=".18"/><path d="M518.5 338 l2.5 2.5 l4.5 -5" stroke="#FBBF24" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="538" y="342" class="f">Highlighted warning signs + reasoning log</text></g><line x1="514" y1="360" x2="912" y2="360" stroke="#30363D"/>
<text x="514" y="382" class="cap">Python · standard library only</text>
<g class="fu" style="animation-delay:1.55s"><text x="894" y="382" class="cta" fill="#FBBF24">View code</text>
<g class="arrow"><path d="M900 377.5 h10 m-4 -4 l4 4 l-4 4" stroke="#FBBF24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</svg>